# /etc/fail2ban/action.d/awg-panel-docker.conf
#
# Бан для портов, опубликованных Docker. Пакет на адрес:44090 приходит через
# PREROUTING(DNAT) -> FORWARD, поэтому правила в INPUT его не касаются: DOCKER-USER —
# единственное штатное место, куда Docker сам просит вставлять свои фильтры.
# Блокируется адрес целиком (все порты контейнера), без сопоставления порта.

[Init]

# Имя цепочки и способ отбрасывания — как в iptables-multiport.
name = default
blocktype = REJECT --reject-with icmp-port-unreachable

[Definition]

# Переход в DOCKER-USER нужно доставлять и при бане, а не только при старте jail'а:
# при перезагрузке узла fail2ban может подняться раньше dockerd, цепочки ещё нет, третья
# строка actionstart падает, и jail остаётся с пустой f2b-panel — бан визуально «есть»,
# а трафик не отсекается.
actionstart = iptables -N f2b-<name> 2>/dev/null || true
              iptables -C f2b-<name> -j RETURN 2>/dev/null || iptables -A f2b-<name> -j RETURN
              iptables -N DOCKER-USER 2>/dev/null || true
              iptables -C DOCKER-USER -j f2b-<name> 2>/dev/null || iptables -I DOCKER-USER -j f2b-<name>
actionstop = iptables -D DOCKER-USER -j f2b-<name> 2>/dev/null || true
             iptables -F f2b-<name>
             iptables -X f2b-<name>
# Проверка переходом не ограничивается, а доставляет его. Fail2Ban 0.11.2 (Ubuntu 22.04)
# зовёт actioncheck перед каждым баном, при неуспехе откатывает окружение — и отменяет бан,
# не доходя до actionban («Invariant check failed», «Error banning <адрес>», f2b-panel
# остаётся с одним RETURN). Здесь значит «перехода нет» = «поставить его», и только
# потом разрешить бан; если ставить нечего (DOCKER-USER ещё нет), команда вернёт ошибку и бан
# не состоится — молча банить в цепочку, куда никто не заходит, хуже.
actioncheck = iptables -C DOCKER-USER -j f2b-<name> 2>/dev/null || iptables -I DOCKER-USER -j f2b-<name>
actionban = iptables -N DOCKER-USER 2>/dev/null || true
          iptables -C DOCKER-USER -j f2b-<name> 2>/dev/null || iptables -I DOCKER-USER -j f2b-<name>
          iptables -I f2b-<name> 1 -s <ip> -j <blocktype>
actionunban = iptables -D f2b-<name> -s <ip> -j <blocktype> 2>/dev/null || true
