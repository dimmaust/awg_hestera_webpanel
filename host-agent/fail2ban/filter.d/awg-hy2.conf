# /etc/fail2ban/filter.d/awg-hy2.conf
# Отказ Hysteria2: сервер спрашивает панель, панель пишет адрес клиента из payload addr.
# 2026-11-06T15:37:12 HY2_AUTH_FAIL ip=203.0.113.7 user=hy2
[Definition]

datepattern = ^%%Y-%%m-%%dT%%H:%%M:%%S

failregex = ^\s*HY2_AUTH_FAIL ip=<HOST> user=\S+$

ignoreregex =
