# /etc/fail2ban/jail.d/awg-panel.conf
#
# Политика оператора: две неудачи — бан на 30 минут, вторая волна — навсегда.
# Поэтому в рабочих jail'ах maxretry = 2 (первая опечатка не блокирует доступ), а [recidive]
# срабатывает на второе событие бана (maxretry = 2) и выдаёт bantime = -1, то есть без
# разблокировки. Итоговая лестница: 2 неверные попытки за час → 30 минут; второй бан за сутки
# → DROP навсегда.
#
# Логи, на которые смотрим:
#   /var/log/auth.log               — sshd;
#   /var/log/awg-panel/audit.log    — вход в панель (FAILED_LOGIN) и отказы Hysteria2
#                                     (HY2_AUTH_FAIL); адрес клиента hysteria кладёт
#                                     сама в payload addr, адрес веб-входа берёт Docker.
#
# Hysteria2 слушает на хосте, поэтому её бан живёт в INPUT. Панель опубликована Docker'ом,
# и трафик к ней идёт через FORWARD: для неё отдельное действие awg-panel-docker,
# которое ставит правило в цепочку DOCKER-USER.
#
# ignoreip — страховка от самоотсечения: docker-шлюз (запросы самого узла к панели приходят
# с него), пул AmneziaWG и адреса оператора. Свои адреса добавляет jail.d/awg-panel.local
# через ключ operator_ip — файл .local имеет приоритет над этим и его не трогает install.sh.

[DEFAULT]
bantime = 1800
findtime = 1h
maxretry = 2
backend = polling
operator_ip =
ignoreip = 127.0.0.1/8 ::1 172.18.0.0/16 10.66.0.0/24 %(operator_ip)s

[sshd]
enabled = true
mode = normal
port = ssh
logpath = /var/log/auth.log

[awg-panel]
enabled = true
filter = awg-panel
port = 44090
protocol = tcp
logpath = /var/log/awg-panel/audit.log
action = awg-panel-docker[name=panel]

[awg-hy2]
enabled = true
filter = awg-hy2
port = 43522
protocol = udp
logpath = /var/log/awg-panel/audit.log
# Для VPN-порта DROP вместо REJECT: клиенту так выглядит обрывом сети, а не отказом.
action = iptables-multiport[name=hy2, port="43522", protocol=udp, blocktype=DROP]

[recidive]
enabled = true
maxretry = 2
findtime = 24h
bantime = -1
logpath = /var/log/fail2ban.log
action = iptables-allports[name=recidive, protocol=all, blocktype=DROP]
         awg-panel-docker[name=recidive-docker, blocktype=DROP]
