# /etc/telemt/telemt.toml — движок MTProto (telemt) для раздела «MTProto» панели.
#
# Панель этот файл НЕ редактирует: клиентов, `enabled` и подменные домены пишет сам telemt
# через Control API ([server.api]), а панель только вызывает этот API через хост-агент.
# Имена ключей и значения по умолчанию взяты из CONFIG_PARAMS.en.md того же релиза telemt,
# на котором собрана интеграция; ничего вымышленного здесь нет.
#
# Файл должен принадлежать пользователю telemt: API меняет его атомарной записью
# (tmp + rename в том же каталоге, mode/uid/gid сохраняются). Bind-mount одного файла
# в контейнер ломает такую запись (Device or resource busy) — монтировать нужно каталог.

[general]
use_middle_proxy = true
log_level = "normal"

# ee-ссылки (TLS) — единственный режим, который отдаёт панель; classic и secure выключены,
# чтобы в списке клиентов не было ссылок, которые подменный домен не прячут вовсе.
[general.modes]
classic = false
secure = false
tls = true

[general.links]
show = "*"
# Адрес, который попадает в tg://-ссылки. public_port пустой — значит берётся server.port.
# bootstrap.sh подставляет сюда реальный адрес узла (PUBLIC_HOST); значение ниже — из
# документационного диапазона RFC 5737 и работает только как placeholder ручного запуска.
public_host = "192.0.2.1"
public_port = 443

[server]
port = 443

[[server.listeners]]
ip = "0.0.0.0"

# Control API — единственная дверь панели в движок. Держать строго на loopback:
# через него можно добавить, удалить и отключить клиента.
[server.api]
enabled = true
listen = "127.0.0.1:9091"
whitelist = ["127.0.0.1/32", "::1/128"]
# Сравнивается ВЕСЬ заголовок Authorization, поэтому токен в agent.conf должен быть
# с префиксом: MTPROTO_API_TOKEN=Bearer <64 hex>. Пустая строка = авторизации нет.
auth_header = ""
# minimal_runtime отключён: панель опрашивает живых клиентов сама, кэш снапшота ей не нужен.
minimal_runtime_enabled = false

[censorship]
# Подменный (cover) TLS-домен. Решён оператором 07.11.2026: www.bing.com — тот же фронт, что уже
# использует Hysteria2 на этом узле (sni=www.bing.com на udp/43522), поэтому наружу узел выглядит
# одинаково для обоих протоколов. Домен кладётся в ee-ссылку HEX-ом: при смене tls_domain прежний
# домен панель оставляет в пуле tls_domains, и старые ссылки продолжают работать.
tls_domain = "www.bing.com"
# Пул прежних доменов; панель добавляет в него предыдущий домен при переключении.
tls_domains = []
# "drop" — молча сбрасывать handshake с незнакомым SNI. Остальные значения
# ("mask", "accept", "reject_handshake") меняют видимое поведение сервера для сканера.
unknown_sni_action = "drop"
mask = true
tls_emulation = true
# Каталог кэша TLS-профилей, относительно WorkingDirectory (= /opt/telemt). Заполняет сам
# движок при подготовке новой генерации: 07.11.2026 на переключении домена в кэше за ~11 с
# появился профиль нового домена, а генерация применилась (state = succeeded).
tls_front_dir = "tlsfront"

# Движок не поднимается без клиентов: "Invalid config: Config error: No users configured"
# (проверено на 3.5.16, 07.11.2026). Пустое значение секрета движок считает тем же «нет
# клиентов», так что placeholder не открывает прокси, а делает отказ запуска громким.
# bootstrap.sh заменяет его настоящим 32-hex секретом на узле; дальше панель
# создаёт клиентов, и bootstrap можно удалить, только если в списке остался хоть один.
[access.users]
bootstrap = ""
